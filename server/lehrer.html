<!doctype html>
<html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🎓%3C/text%3E%3C/svg%3E">
<title>Lehrkraft · KBM Prüfungscoach</title>
<style>
  body{font-family:system-ui;max-width:960px;margin:2rem auto;padding:0 1rem;color:#0f172a;background:#f1f5f9}
  .karte{background:#fff;border:2px solid #e2e8f0;border-radius:14px;padding:1.2rem;margin-bottom:1rem}
  input,select,button{font:inherit;padding:.65rem;border:1px solid #cbd5e1;border-radius:8px}
  button{background:#0f172a;color:#fff;border:0;font-weight:600;cursor:pointer;min-height:44px}
  table{width:100%;border-collapse:collapse;font-size:.92rem}
  td,th{border-bottom:1px solid #e2e8f0;padding:.5rem .4rem;text-align:left}
  .ok{color:#15803d}.rot{color:#b91c1c}
  .zeile{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
  .kpi{display:inline-block;background:#f1f5f9;border-radius:10px;padding:.5rem .9rem;margin-right:.5rem;text-align:center}
  .kpi b{display:block;font-size:1.3rem}
  #app{display:none}
  .balken{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;min-width:70px}
  .balken>div{height:100%;background:#0ea5e9;border-radius:99px}
</style>
<body>
<h1>🧑‍🏫 Klassenübersicht — live</h1>

<form id="login" class="karte" onsubmit="return false">
  <h2>Anmelden (Lehrkraft)</h2>
  <div class="zeile">
    <input id="l-email" type="email" placeholder="E-Mail" style="flex:1;min-width:200px">
    <input id="l-pass" type="password" placeholder="Passwort" style="flex:1;min-width:160px">
  </div>
  <div class="zeile" style="margin-top:.6rem">
    <span>🤖-Schutz: <b id="l-frage">…</b> =</span>
    <input id="l-captcha" inputmode="numeric" placeholder="Ergebnis" style="width:6.5rem">
    <button id="l-los" type="submit">Anmelden</button>
  </div>
  <p id="l-m" class="rot"></p>
</form>

<div id="app">
  <div class="karte zeile" style="justify-content:space-between">
    <div class="zeile">
      <b id="a-wer"></b>
      <select id="k-liste"></select>
      <label style="font-size:.9rem"><input type="checkbox" id="a-live" checked> 🔄 Live (30 s)</label>
    </div>
    <button id="a-logout" style="background:#fff;color:#0f172a;border:2px solid #cbd5e1">Abmelden</button>
  </div>

  <div class="karte" id="k-stat"></div>

  <div class="karte">
    <h2>Mitglieder <span id="stand" style="font-weight:400;color:#94a3b8;font-size:.8rem"></span></h2>
    <table><thead><tr>
      <th>Name</th><th>Geübt</th><th>Quote</th><th>Streak</th><th>Sims</th><th>Letzte Note</th><th>Heute aktiv</th>
    </tr></thead><tbody id="m-tab"></tbody></table>
  </div>

  <div class="karte">
    <h2>⚠ Schwierigkeiten der Klasse</h2>
    <p style="color:#64748b;font-size:.9rem">Aufgaben, die mehrere Schüler öfter falsch als richtig hatten:</p>
    <div id="probleme"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
// XSS-Schutz: alle Strings aus DB/Fortschrittsdaten vor innerHTML escapen.
const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
  (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api = async (pfad, opts = {}) => {
  const r = await fetch('api/' + pfad, { headers: {'Content-Type':'application/json'}, credentials:'same-origin', ...opts });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw d;
  return d;
};
let aufgabenTexte = {};   // aufgabeId -> Textanfang (aus den statischen App-Daten)
let timer = null;

async function aufgabenLaden() {
  for (const b of ['wiso','kbz','buchfuehrung','muendlich']) {
    try {
      const liste = await (await fetch('../data/aufgaben/' + b + '.json')).json();
      for (const a of liste) aufgabenTexte[a.id] = a.text.replace(/\*\*/g,'').slice(0, 110);
    } catch {}
  }
}

async function captchaLaden(){ try{$('l-frage').textContent=(await api('captcha.php')).frage;}catch{} }

async function start() {
  try {
    const me = await api('me.php');
    if (me.nutzer && (me.nutzer.rolle === 'lehrer' || me.nutzer.rolle === 'admin')) return anApp(me.nutzer);
  } catch {}
  $('login').style.display='block'; captchaLaden();
}
$('l-los').onclick = async () => {
  try {
    const d = await api('login.php', { method:'POST', body: JSON.stringify({
      email: $('l-email').value, passwort: $('l-pass').value, captcha: $('l-captcha').value }) });
    if (d.zwei_fa) { $('l-m').textContent = 'Admin-Konto: bitte im Admin-Panel (admin.html) mit 2FA anmelden.'; return; }
    anApp(d.nutzer);
  } catch (e) { $('l-m').textContent = e.fehler || 'Fehler'; if (e.captcha) $('l-frage').textContent = e.captcha.frage; else captchaLaden(); }
};
$('a-logout').onclick = async () => { await api('logout.php'); location.reload(); };

async function anApp(n) {
  $('login').style.display='none'; $('app').style.display='block';
  $('a-wer').textContent = n.name || n.email;
  await aufgabenLaden();
  const d = await api('lehrer/klassen.php');
  const s = $('k-liste'); s.innerHTML='';
  for (const k of d.klassen) s.add(new Option(`${k.name} (${k.mitglieder})`, k.id));
  s.onchange = laden;
  $('a-live').onchange = liveSchalten;
  liveSchalten(); laden();
}
function liveSchalten(){
  clearInterval(timer);
  if ($('a-live').checked) timer = setInterval(laden, 30000);
}

async function laden() {
  const kid = $('k-liste').value; if (!kid) return;
  const d = await api('lehrer/statistik.php?klasse_id=' + kid);
  const k = d.klasse;
  $('k-stat').innerHTML =
    `<span class="kpi"><b>${k.anzahl}</b>Schüler</span>` +
    `<span class="kpi"><b>${k.aktivHeute}</b>heute aktiv</span>` +
    `<span class="kpi"><b>${k.quoteSchnitt ?? '—'}${k.quoteSchnitt !== null ? ' %' : ''}</b>Ø Trefferquote</span>`;
  const tb = $('m-tab'); tb.innerHTML='';
  for (const m of d.mitglieder) {
    const tr = tb.insertRow();
    const q = m.quote;
    tr.innerHTML = `<td>${esc(m.name || m.email)}</td><td>${m.geuebt}</td>
      <td>${q === null ? '—' : `<span style="display:flex;align-items:center;gap:.4rem"><span class="balken" style="flex:1"><div style="width:${q}%"></div></span><b style="min-width:2.6rem">${q} %</b></span>`}</td>
      <td>${m.streak > 0 ? '🔥 ' + m.streak : '—'}</td>
      <td>${m.simulationen}</td>
      <td>${m.letzteNote ?? '—'}</td>
      <td>${m.aktivHeute ? '<span class="ok">● jetzt</span>' : '—'}</td>`;
  }
  $('probleme').innerHTML = k.problemAufgaben.length === 0
    ? '<p class="ok">Keine auffälligen Aufgaben 🎉</p>'
    : k.problemAufgaben.map(p =>
        `<p style="margin:.35rem 0"><b>${+p.schueler}×</b> ${esc(aufgabenTexte[p.aufgabeId] ?? p.aufgabeId)} …</p>`).join('');
  $('stand').textContent = '· Stand ' + new Date().toLocaleTimeString('de-DE');
}
start();
</script>
</body></html>
